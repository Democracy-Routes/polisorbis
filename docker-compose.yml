# Before running docker compose up for the first time,
# first copy the env.example file to .env and fill in the values.
# `cp env.example .env`
# (edit values as needed)
#
# Then, build and run with:
# `docker compose build`
# `docker compose up`
#
# Subsequently you should only need to run:
# `docker compose up`
#
# Force a full re-build with no cache from previous builds:
# `docker compose build --no-cache`
# `docker compose up`
#
# If you only changed the .env file, you can do a quick rebuild:
# `docker compose up --force-recreate`
#
# To stop, press CTRL+C (if not running in --detach mode), or run:
# `docker compose down`

services:
  server:
    env_file:
      - ${SERVER_ENV_FILE:-.env}
    environment:
      - PRUNE_OLDER_THAN=${PRUNE_OLDER_THAN:-172800}
      - PRUNE_SCHEDULE=${PRUNE_SCHEDULE:-0 3 * * *}
    image: registry.gitlab.com/copernicani/polisorbis/codebase/server:dev
    build:
      context: ./server
      dockerfile: Dockerfile
      target: prod
      args:
        NODE_ENV: production
      labels:
        polis_tag: ${TAG:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      file-server:
        condition: service_started
    networks:
      - "polis-net"
    # Scale the server container to a given number of instances.
    scale: 1
    volumes:
    # Persist logs to a volume, so they can be accessed after the container is stopped.
      - server-logs:/app/logs

  math:
    image: registry.gitlab.com/copernicani/polisorbis/codebase/math:dev
    build:
      context: ./math
      labels:
        polis_tag: ${TAG:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:?error}
      - MATH_ENV=${MATH_ENV:-prod}
      - WEBSERVER_USERNAME=${WEBSERVER_USERNAME:?error}
      - WEBSERVER_PASS=${WEBSERVER_PASS:?error}
    networks:
      - "polis-net"

  postgres:
    image: registry.gitlab.com/copernicani/polisorbis/codebase/postgres:dev
    restart: always
    build:
      context: ./server
      dockerfile: Dockerfile-db
      labels:
        polis_tag: ${TAG:-dev}
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?error}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?error}
      - POSTGRES_USER=${POSTGRES_USER:?error}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?error} -d ${POSTGRES_DB:?error}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - "polis-net"
    volumes:
      - "backups:/backups"
      - "postgres:/var/lib/postgresql"

  nginx-proxy:
    image: docker.io/compdem/polis-nginx-proxy:${TAG:-dev}
    build:
      context: ./file-server
      dockerfile: nginx.Dockerfile
      labels:
        polis_tag: ${TAG:-dev}
    depends_on:
      - "server"
    networks:
      - "polis-net"
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443

  file-server:
    image: registry.gitlab.com/copernicani/polisorbis/codebase/file-server-demo:dev
    build:
      context: ./
      dockerfile: file-server/Dockerfile
      labels:
        polis_tag: ${TAG:-dev}
      args:
        EMBED_SERVICE_HOSTNAME: ${EMBED_SERVICE_HOSTNAME}
        ENABLE_TWITTER_WIDGETS: ${ENABLE_TWITTER_WIDGETS:-false}
        FB_APP_ID: ${FB_APP_ID}
        GA_TRACKING_ID: ${GA_TRACKING_ID}
        GIT_HASH: "${GIT_HASH:-placeholder}"
        NODE_ENV: production
        SERVICE_URL: ${SERVICE_URL}
        P_HOME_NAME: ${P_HOME_NAME}
        P_LOGO_ICO_URL: ${P_LOGO_ICO_URL}
        P_LOGO_URL: ${P_LOGO_URL}
        P_TITLE: ${P_TITLE}
        P_CLAIM: ${P_CLAIM}
        P_DESCRIPTION: ${P_DESCRIPTION}
        P_DOC_URL: ${P_DOC_URL}
        P_REPO_URL: ${P_REPO_URL}
        P_TOS_URL: ${P_TOS_URL}
        P_PRIVACY_POLICY_URL: ${P_PRIVACY_POLICY_URL}
        P_OPENID_ENABLED: ${P_OPENID_ENABLED}
        P_OPENID_PROVIDER_NAME: ${P_OPENID_PROVIDER_NAME}
        P_OPENID_PROFILE_PAGE_URL: ${P_OPENID_PROFILE_PAGE_URL}
        P_ORBIS_RATING: ${P_ORBIS_RATING}
        P_OPERATOR_NAME: ${P_OPERATOR_NAME}
        P_OPERATOR_ADDRESS: ${P_OPERATOR_ADDRESS}
        P_OPERATOR_EMAIL: ${P_OPERATOR_EMAIL}
        P_OPERATOR_DPO: ${P_OPERATOR_DPO}
        P_HOSTING_COUNTRY: ${P_HOSTING_COUNTRY}
        P_SUPERVISORY_AUTHORITY: ${P_SUPERVISORY_AUTHORITY}
        P_RETENTION: ${P_RETENTION}
        P_GOVERNING_LAW: ${P_GOVERNING_LAW}
    environment:
      - PORT=${STATIC_FILES_PORT:-8080}
    networks:
      - "polis-net"

networks:
  polis-net:

volumes:
  backups:
    labels:
      polis_tag: ${TAG:-dev}
  postgres:
    labels:
      polis_tag: ${TAG:-dev}
  server-logs:
    labels:
      polis_tag: ${TAG:-dev}
