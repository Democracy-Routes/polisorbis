workflow:
  rules:
    - if: "$CI_COMMIT_TAG"
      variables:
        TAG: $CI_COMMIT_TAG
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        TAG: $CI_COMMIT_SHA
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      variables:
        TAG: $CI_COMMIT_SHA

stages:
  - build

server:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    FULL_IMAGE_TAG: $CI_REGISTRY_IMAGE/server:$TAG
  script:
    - cd server
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $FULL_IMAGE_TAG --target prod --build-arg NODE_ENV=production .
    - docker push $FULL_IMAGE_TAG

math:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    FULL_IMAGE_TAG: $CI_REGISTRY_IMAGE/math:$TAG
  script:
    - cd math
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $FULL_IMAGE_TAG  .
    - docker push $FULL_IMAGE_TAG

postgres:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    FULL_IMAGE_TAG: $CI_REGISTRY_IMAGE/postgres:$TAG
  script:
    - cd server
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $FULL_IMAGE_TAG -f Dockerfile-db .
    - docker push $FULL_IMAGE_TAG

file-server-demo:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    FULL_IMAGE_TAG: $CI_REGISTRY_IMAGE/file-server:demo-$TAG
    P_LOGO_ICO_URL: "https://doc.polisorbis.copernicani.it/images/polisorbis-logo-square.png"
    P_LOGO_URL: "https://doc.polisorbis.copernicani.it/"
    P_TITLE: "PolisOrbis"
    P_CLAIM: "Welcome to PolisOrbis sandbox"
    P_DESCRIPTION: "You can use this service to test PolisOrbis. The service is reset every Saturday: do not use for production pools."
    P_DOC_URL: "https://doc.polisorbis.copernicani.it/"
    P_REPO_URL: "https://gitlab.com/copernicani/polisorbis"
    P_TOS_URL: "https://copernicani.it/privacy-policy/"
    P_PRIVACY_POLICY_URL: "https://copernicani.it/privacy-policy/"
    P_OPENID_ENABLED: "false"
    P_OPENID_PROVIDER_NAME: "Mopso"

  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - |-
      docker build -t $FULL_IMAGE_TAG -f file-server/Dockerfile \
      --build-arg NODE_ENV=production \
      --build-arg P_LOGO_ICO_URL="$P_LOGO_ICO_URL" \
      --build-arg P_LOGO_URL="$P_LOGO_URL" \
      --build-arg P_TITLE="$P_TITLE" \
      --build-arg P_CLAIM="$P_CLAIM" \
      --build-arg P_DESCRIPTION="$P_DESCRIPTION" \
      --build-arg P_DOC_URL="$P_DOC_URL" \
      --build-arg P_REPO_URL="$P_REPO_URL" \
      --build-arg P_TOS_URL="$P_TOS_URL" \
      --build-arg P_OPENID_ENABLED="$P_OPENID_ENABLED" \
      --build-arg P_OPENID_PROVIDER_NAME="$P_OPENID_PROVIDER_NAME" \
      --build-arg P_PRIVACY_POLICY_URL="$P_PRIVACY_POLICY_URL" \
        .

    - docker push $FULL_IMAGE_TAG

file-server-prod:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    FULL_IMAGE_TAG: $CI_REGISTRY_IMAGE/file-server:prod-$TAG # <-- TAG is differente from demo
    P_LOGO_ICO_URL: "https://doc.polisorbis.copernicani.it/images/polisorbis-logo-square.png"
    P_LOGO_URL: "https://doc.polisorbis.copernicani.it/images/polisorbis-logo.png"
    P_TITLE: "PolisOrbis"
    P_CLAIM: "Input Crowd, Output Meaning"
    P_DESCRIPTION: "PolisOrbis is a real-time system for gathering, analyzing and understanding what large groups of people think in their own words, enabled by advanced statistics and machine learning"
    P_DOC_URL: "https://doc.polisorbis.copernicani.it"
    P_REPO_URL: "https://gitlab.com/copernicani/polisorbis/codebase"
    P_TOS_URL: "https://copernicani.it/privacy-policy/"
    P_PRIVACY_POLICY_URL: "https://copernicani.it/privacy-policy/"
    P_OPENID_ENABLED: "true"
    P_OPENID_PROVIDER_NAME: "Mopso"

  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - |-
      docker build -t $FULL_IMAGE_TAG -f file-server/Dockerfile \
      --build-arg NODE_ENV=production \
      --build-arg P_LOGO_ICO_URL="$P_LOGO_ICO_URL" \
      --build-arg P_LOGO_URL="$P_LOGO_URL" \
      --build-arg P_TITLE="$P_TITLE" \
      --build-arg P_CLAIM="$P_CLAIM" \
      --build-arg P_DESCRIPTION="$P_DESCRIPTION" \
      --build-arg P_DOC_URL="$P_DOC_URL" \
      --build-arg P_REPO_URL="$P_REPO_URL" \
      --build-arg P_TOS_URL="$P_TOS_URL" \
      --build-arg P_OPENID_ENABLED="$P_OPENID_ENABLED" \
      --build-arg P_OPENID_PROVIDER_NAME="$P_OPENID_PROVIDER_NAME" \
      --build-arg P_PRIVACY_POLICY_URL="$P_PRIVACY_POLICY_URL" \
        .

    - docker push $FULL_IMAGE_TAG
